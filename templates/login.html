{% extends "base.html" %}

{% block title %}Login - Retail IMS{% endblock %}

{% block content %}
<div class="container d-flex flex-grow-1 justify-content-center align-items-center py-5">
    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-dark mb-1">Retail IMS</h1>
            <p class="text-muted small">Sign in to your account</p>
        </div>
        <form method="POST" action="">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                <input type="text" class="form-control form-control-lg fs-6" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                <input type="password" class="form-control form-control-lg fs-6" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fs-6 fw-semibold">Login</button>
        </form>
    </div>
</div>
{% endblock %}
